name: Deploy masonlaneous.com

on:
  push:
    paths:
      - apps/main/**
      - apps/silly/**
      - .github/workflows/main.yaml
      - package.json

jobs:
  build-and-deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v6

      - name: Build Main App Image
        run: cd apps/main && docker build --network=host -t masonlaneous -f Dockerfile ../..

      - name: Build Silly App Image
        run: cd apps/silly && docker build --network=host -t silly-masonlaneous -f Dockerfile ../..

      - name: Deploy
        run: sudo docker compose -f /opt/personalsite/docker-compose.yml up -d